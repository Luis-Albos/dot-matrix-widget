:root{--white:#fff;--gray:#cfcfcf;--muted:#8998ae;--cyan:#38bdf8;--blue:#0ea5e9;--green:#16a34a;--amber:#f59e0b;--line:#516781;--dot-spacing:4px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}
body{color:var(--white);font-family:"Alephon Matrix",monospace;font-synthesis:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.viewport{width:100vw;height:100vh;height:100dvh;padding:max(18px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(15px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));background-image:radial-gradient(circle,#17202055 .65px,transparent .9px);background-size:4px 4px}
.console{height:100%;display:grid;grid-template-rows:11% 39% 41% 9%;will-change:transform;min-width:0}
.header,.rail{display:flex;align-items:center;justify-content:space-between;gap:2vw;min-width:0}
.header{border-bottom:2px dotted var(--line);padding:0 1.2vw 1.5vh;font-size:clamp(12px,1.65vw,24px);letter-spacing:.1em}
.header-left,.header-right{display:flex;align-items:center;gap:2vw;white-space:nowrap}
.date{font-weight:600}.day{border-left:2px dotted var(--line);padding-left:2vw;color:var(--muted);font-size:.77em}

.main{display:grid;grid-template-columns:60% 40%;padding:3.2vh 1.2vw;border-bottom:2px dotted var(--line);min-height:0}
section{min-width:0;min-height:0}h1,h2,p{margin:0}h2{font-size:clamp(12px,1.55vw,23px);font-weight:400;letter-spacing:.095em;color:var(--muted)}
.clock-section{padding-right:2vw;display:flex;flex-direction:column;justify-content:space-between}
.clock-wrap{display:flex;align-items:flex-end;gap:1.2vw;min-width:0;margin:auto 0;position:relative}
.clock-digits{width:100%;height:auto;display:block;overflow:visible}.clock-art{width:83%;min-width:0}.period{font-size:clamp(20px,3.6vw,52px);color:var(--cyan);padding-bottom:.4vw;letter-spacing:.04em}
.clock-wrap.seconds .clock-art{width:85%}.clock-wrap.seconds .period{font-size:2.5vw}
.colon{animation:breathe 2s ease-in-out infinite}@keyframes breathe{50%{opacity:.55}}

.weather-icon{width:100%;height:100%;max-height:17vh}.weather-reading{min-width:0}.temperature{font-size:clamp(40px,7.4vw,112px);line-height:1.1;letter-spacing:-.07em;font-weight:600;white-space:nowrap}

.condition{color:var(--cyan);font-size:clamp(11px,1.35vw,21px);letter-spacing:.03em;line-height:1.3;min-height:2.6em;display:flex;align-items:center}

<body>
<!-- 3. HTML STRUCTURE -->
<div class="viewport"><main class="console" id="console" aria-label="Alephon desk console">
 <header class="header"><div class="header-left"><time class="date" id="date">—</time><span class="day" id="day">DAY —</span></div><div class="header-right"><span class="location" id="location"></span><span class="connection" id="connection" role="status"><span class="connection-dot" aria-hidden="true"></span><span id="connection-label">CONNECTING</span></span></div></header>
 <div class="main">
  <section class="clock-section" aria-labelledby="clock-heading"><h2 id="clock-heading">LOCAL TIME</h2><div class="clock-wrap" id="clock-wrap"><time class="sr-only" id="accessible-time"></time><div class="clock-art" id="clock-art" aria-hidden="true"></div><span class="period" id="period" aria-hidden="true"></span></div></section>
  <section class="weather-section" aria-labelledby="weather-heading"><h2 id="weather-heading">CURRENT WEATHER</h2><div class="weather-main"><div class="weather-icon" id="current-icon" aria-hidden="true"></div><div class="weather-reading"><p class="temperature dots" id="temperature">--°</p><p class="condition" id="condition">NO WEATHER DATA</p></div></div><div class="weather-details"><span><span>H </span><b id="high">--°</b></span><span><span>L </span><b id="low">--°</b></span><span><span>FEELS </span><b id="feels">--°</b></span></div></section>
 </div>
 <div class="lower">
  <section class="forecast-section" aria-labelledby="forecast-heading"><h2 id="forecast-heading">HOURLY FORECAST</h2><div class="forecast" id="forecast"></div></section>
  <section class="environment" aria-labelledby="environment-heading"><h2 id="environment-heading">ENVIRONMENTAL</h2><dl>
   <div class="env-row"><dt><span class="env-icon" data-icon="drop" data-color="green" aria-hidden="true"></span>PRECIP</dt><dd id="precip">--%</dd></div>
   <div class="env-row"><dt><span class="env-icon" data-icon="drop" data-color="blue" aria-hidden="true"></span>HUMIDITY</dt><dd id="humidity">--%</dd></div>
   <div class="env-row"><dt><span class="env-icon" data-icon="wind" aria-hidden="true"></span>WIND</dt><dd id="wind">-- MPH</dd></div>
   <div class="env-row"><dt><span class="env-icon" data-icon="sunset" aria-hidden="true"></span>SUNSET</dt><dd id="sunset">--:--</dd></div>
   <div class="env-row"><dt><span class="env-icon" data-icon="sunrise" aria-hidden="true"></span>SUNRISE</dt><dd id="sunrise">--:--</dd></div>
  </dl></section>
 </div>
 <footer class="rail"><div class="context-status" id="context-status" role="status" aria-live="polite" aria-atomic="true"><span class="rail-icon" id="context-icon" aria-hidden="true"></span><span class="context-text" id="context-text">FORECAST UNAVAILABLE</span></div><div class="weather-update"><div class="wx-status"><span class="rail-icon" id="signal" aria-hidden="true"></span><span id="updated">WX AWAITING DATA</span></div><a class="credit" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Weather by Open-Meteo · CC BY 4.0</a></div></footer>
</main></div><output id="debug" hidden></output>
<script>
"use strict";
// 4. CONFIGURATION · Edit normal settings here. No build or API key required.
const CONFIG = {
    location: { name: "DESOTO, TEXAS", latitude: 32.5899, longitude: -96.8570 },
    clock: { use24Hour: false, showSeconds: false },
    weather: { refreshMinutes: 15, timeoutSeconds: 20 }, // Fahrenheit / MPH. Minimum refresh: 5 minutes.
    // Automatic footer thresholds. Times in this rail use the weather location's timezone.
    weatherStatus: {
        lookAheadHours: 6,
        precipitationPossiblePercent: 40,
        precipitationExpectedPercent: 60,
        significantTemperatureChangeF: 6,
        solarCountdownMinutes: 120,
        breezyMph: 14,
        strongWindMph: 25,
        humidPercent: 80,
        staleAfterMinutes: 60
    },
    appearance: {
        dotDensity: 4, // CSS dot pitch in pixels (3–6); clock dot density follows this too.
        burnInProtection: true,
        nightDimming: { enabled: false, startHour: 23, endHour: 6, brightness: 0.78 }
    },
    debug: false
};
const $ = id => document.getElementById(id);
const COLORS = { white:"#ffffff", gray:"#cfcfcf", cyan:"#38bdf8", blue:"#0ea5e9", green:"#16a34a", amber:"#f59e0b" };
const refreshMs = Math.max(5, Number(CONFIG.weather.refreshMinutes) || 15) * 60000;
const state = { data:null, lastSuccessfulWeatherUpdate:0, lastAttempt:0, busy:false, failed:false, fetchStatus:"Not requested", cacheStatus:"Available" };
const number = value => typeof value === "number" && Number.isFinite(value);
const rounded = (value, suffix="") => number(value) ? Math.round(value) + suffix : "--" + suffix;
const setText = (id, value) => { if ($(id).textContent !== value) $(id).textContent = value; };

// 5. CLOCK / DATE · Calendar arithmetic uses UTC day boundaries to avoid DST errors.
const DIGITS = {
 "0":["01110","11011","11011","11011","11011","11011","01110"],
 "1":["00110","01110","00110","00110","00110","00110","01111"],
 "2":["01110","11011","00011","00110","01100","11000","11111"],
 "3":["11110","00011","00011","01110","00011","00011","11110"],
 "4":["00011","00111","01111","11011","11111","00011","00011"],
 "5":["11111","11000","11000","11110","00011","00011","11110"],
 "6":["01110","11000","11000","11110","11011","11011","01110"],
 "7":["11111","00011","00110","00110","01100","01100","01100"],
 "8":["01110","11011","11011","01110","11011","11011","01110"],
 "9":["01110","11011","11011","01111","00011","00011","01110"],
 ":":["0","1","1","0","1","1","0"]
};
let previousClock = "", previousMinute = "";
function renderClockDots(text) {
    const subdivisions = CONFIG.appearance.dotDensity >= 5 ? 2 : 3;
    let x = 0, circles = "";
    for (const char of text) {
        const glyph = DIGITS[char]; let dots = "";
        glyph.forEach((row,y) => [...row].forEach((pixel,column) => {
            if (pixel !== "1") return;
            for (let sy=0;sy<subdivisions;sy++) for(let sx=0;sx<subdivisions;sx++) {
                const step=3/subdivisions;
                dots += `<circle cx="${x+column*3+(sx+.5)*step}" cy="${y*3+(sy+.5)*step}" r="${step*.36}"/>`;
            }
        }));
        circles += `<g${char === ":" ? ' class="colon"' : ""}>${dots}</g>`;
        x += glyph[0].length*3 + 3;
    }
    $("clock-art").innerHTML = `<svg class="clock-digits" viewBox="0 0 ${x-3} 21" fill="#fff" aria-hidden="true">${circles}</svg>`;
}
function updateClock() {
    const now = new Date(), hours = now.getHours();
    const hh = CONFIG.clock.use24Hour ? String(hours).padStart(2,"0") : String(hours%12 || 12);
    const mm = String(now.getMinutes()).padStart(2,"0");
    const value = hh + ":" + mm + (CONFIG.clock.showSeconds ? ":" + String(now.getSeconds()).padStart(2,"0") : "");
    if(value !== previousClock) { renderClockDots(value); previousClock=value; }
    setText("period",CONFIG.clock.use24Hour ? "" : hours < 12 ? "AM" : "PM");
    setText("accessible-time",now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",...(CONFIG.clock.showSeconds ? {second:"2-digit"}:{}),hour12:!CONFIG.clock.use24Hour}));
    $("accessible-time").dateTime=now.toISOString();
    const date = `${now.toLocaleDateString("en-US",{weekday:"short"})} ${String(now.getDate()).padStart(2,"0")} ${now.toLocaleDateString("en-US",{month:"short"})} ${now.getFullYear()}`.toUpperCase();
    setText("date",date);
    $("date").dateTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
    setText("day","DAY " + String(Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(now.getFullYear(),0,0))/86400000)).padStart(3,"0"));
    const dim=CONFIG.appearance.nightDimming;
    const night=dim.startHour>dim.endHour ? hours>=dim.startHour || hours<dim.endHour : hours>=dim.startHour && hours<dim.endHour;
    $("console").style.opacity=dim.enabled && night ? Math.max(.3,Math.min(1,dim.brightness)) : 1;
    const minuteKey = now.toISOString().slice(0,16);
    if(previousMinute !== minuteKey) { previousMinute=minuteKey; renderWeather(); updateStatus(); }
}

// 6. WEATHER · Epoch timestamps are actual instants; Intl handles the location timezone.
// API documentation: https://open-meteo.com/en/docs · Free endpoint for noncommercial use.
const CONDITIONS = {
 0:["CLEAR","clear","amber"],1:["MOSTLY CLEAR","partly","cyan"],2:["PARTLY CLOUDY","partly","cyan"],3:["OVERCAST","cloud","gray"],
 45:["FOG","fog","gray"],48:["RIME FOG","fog","gray"],
 51:["LIGHT DRIZZLE","rain","cyan"],53:["DRIZZLE","rain","cyan"],55:["DENSE DRIZZLE","rain","blue"],56:["FREEZING DRIZZLE","sleet","cyan"],57:["FREEZING DRIZZLE","sleet","cyan"],
 61:["LIGHT RAIN","rain","blue"],63:["RAIN","rain","blue"],65:["HEAVY RAIN","rain","blue"],66:["FREEZING RAIN","sleet","cyan"],67:["FREEZING RAIN","sleet","cyan"],
 71:["LIGHT SNOW","snow","cyan"],73:["SNOW","snow","cyan"],75:["HEAVY SNOW","snow","cyan"],77:["SNOW GRAINS","snow","cyan"],
 80:["RAIN SHOWERS","rain","blue"],81:["RAIN SHOWERS","rain","blue"],82:["HEAVY SHOWERS","rain","blue"],85:["SNOW SHOWERS","snow","cyan"],86:["HEAVY SNOW","snow","cyan"],
 95:["THUNDERSTORM","storm","amber"],96:["STORM / HAIL","storm","amber"],99:["STORM / HAIL","storm","amber"]
};
function conditionFor(code, isDay) {
    const entry=CONDITIONS[code] || ["UNKNOWN","unknown","gray"];
    return { label:code===0 && isDay===0 ? "CLEAR NIGHT" : entry[0], icon:entry[1], color:code===0 && isDay===0 ? "cyan" : entry[2] };
}
function buildWeatherURL() {
    const params = new URLSearchParams({
        latitude:CONFIG.location.latitude, longitude:CONFIG.location.longitude,
        current:"temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m",
        hourly:"temperature_2m,precipitation_probability,weather_code,is_day",
        daily:"temperature_2m_max,temperature_2m_min,sunrise,sunset",
        temperature_unit:"fahrenheit",wind_speed_unit:"mph",timezone:"auto",timeformat:"unixtime",forecast_days:"3"
    });
    return "https://api.open-meteo.com/v1/forecast?"+params.toString();
}
function processWeather(raw) {
    if(!raw || raw.error || !raw.current || !number(raw.current.temperature_2m) || !number(raw.current.time) || !raw.hourly || !Array.isArray(raw.hourly.time) || !raw.daily || !Array.isArray(raw.daily.sunrise)) throw new Error("Incomplete API response");
    new Intl.DateTimeFormat("en-US",{timeZone:raw.timezone}).format(new Date());
    return {
        timezone:raw.timezone, current:{ time:raw.current.time, temperature:raw.current.temperature_2m, feels:raw.current.apparent_temperature,
            humidity:raw.current.relative_humidity_2m, wind:raw.current.wind_speed_10m, direction:raw.current.wind_direction_10m, code:raw.current.weather_code, isDay:raw.current.is_day },
        hourly:raw.hourly.time.map((time,i)=>({time,temperature:raw.hourly.temperature_2m?.[i],precip:raw.hourly.precipitation_probability?.[i],code:raw.hourly.weather_code?.[i],isDay:raw.hourly.is_day?.[i]})),
        daily:raw.daily.sunrise.map((sunrise,i)=>({sunrise,sunset:raw.daily.sunset?.[i],high:raw.daily.temperature_2m_max?.[i],low:raw.daily.temperature_2m_min?.[i]}))
    };
}
async function fetchWeather() {
    if(state.busy) return;
    state.busy=true; state.lastAttempt=Date.now(); state.fetchStatus="Fetching"; updateDebug();
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),Math.max(5,Number(CONFIG.weather.timeoutSeconds)||20)*1000);
    try {
        const response=await fetch(buildWeatherURL(),{signal:controller.signal,cache:"no-store",credentials:"omit"});
        if(!response.ok) throw new Error("HTTP " + response.status);
        const processed=processWeather(await response.json());
        state.data=processed;state.lastSuccessfulWeatherUpdate=Date.now();state.failed=false;state.fetchStatus="HTTP " + response.status;
        saveCache();
    } catch(error) {
        state.failed=true;state.fetchStatus=error.name==="AbortError" ? "Request timed out" : error.message;
    } finally {
        clearTimeout(timer);state.busy=false;renderWeather();updateStatus();
    }
}
function weatherTime(epoch, hourOnly=false) {
    if(!number(epoch) || epoch<=0) return "--:--";
    return new Intl.DateTimeFormat("en-US",{timeZone:state.data.timezone,hour:hourOnly ? "numeric" : "2-digit",...(hourOnly ? {} : {minute:"2-digit"}),hour12:!CONFIG.clock.use24Hour}).format(new Date(epoch*1000)).toUpperCase().replace(/\u202f/g," ").replace(hourOnly ? /\s/g : /$^/g,"");
}
function locationDate(epoch) {
    return new Intl.DateTimeFormat("en-CA",{timeZone:state.data.timezone,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(epoch*1000));
}
function renderWeather() {
    const data=state.data, now=Date.now()/1000, current=data?.current;
    const condition=current ? conditionFor(current.code,current.isDay) : {label:"NO WEATHER DATA",icon:"unknown",color:"gray"};
    setText("temperature",rounded(current?.temperature,"°"));setText("condition",condition.label);
    $("condition").style.color=COLORS[condition.color];
    $("current-icon").innerHTML=weatherIcon(condition.icon,current?.isDay);
    const daily=data?.daily.find(day=>number(day.sunrise) && locationDate(day.sunrise)===locationDate(now));
    setText("high",rounded(daily?.high,"°"));setText("low",rounded(daily?.low,"°"));setText("feels",rounded(current?.feels,"°"));
    const hour=data?.hourly.find(row=>row.time<=now && row.time+3600>now);
    setText("precip",rounded(hour?.precip,"%"));setText("humidity",rounded(current?.humidity,"%"));
    const directions=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    setText("wind",rounded(current?.wind," MPH")+(number(current?.direction) ? " "+directions[((Math.round(current.direction/22.5)%16)+16)%16] : ""));
    setText("sunrise",daily ? weatherTime(daily.sunrise) : "--:--");setText("sunset",daily ? weatherTime(daily.sunset) : "--:--");
    const upcoming=data ? data.hourly.filter(row=>row.time>now).slice(0,4) : [];
    // Cached current observations retain their value; the header explicitly marks them CACHED.
    const periods=[current,...Array.from({length:4},(_,i)=>upcoming[i])];
    $("forecast").innerHTML=periods.map((period,i)=>{
        const info=period ? conditionFor(period.code,period.isDay) : {label:"No weather data",icon:"unknown"};
        return `<div class="forecast-item" aria-label="${i===0 ? "Now" : period ? weatherTime(period.time,true) : "Unavailable"}: ${info.label}, ${rounded(period?.temperature)} degrees Fahrenheit"><span class="forecast-label">${i===0 ? "NOW" : period ? weatherTime(period.time,true) : "--"}</span><span class="forecast-icon" aria-hidden="true">${weatherIcon(info.icon,period?.isDay)}</span><span class="forecast-temp dots" aria-hidden="true">${rounded(period?.temperature,"°")}</span></div>`;
    }).join("");
}

// 7. WEATHER ICON RENDERING · Sample geometric strokes onto a true LED dot grid.
// No fonts, emoji, raster assets, external SVGs, or icon packages.
function makeDotIcon(draw) {
    const points=new Map();
    const dot=(x,y,color)=>{ x=Math.round(x);y=Math.round(y);if(x>=0&&x<32&&y>=0&&y<28)points.set(x+","+y,{x,y,color}); };
    const line=(x1,y1,x2,y2,color)=>{const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))*3;for(let i=0;i<=n;i++){const t=n ? i/n : 0;dot(x1+(x2-x1)*t,y1+(y2-y1)*t,color);}};
    const arc=(cx,cy,r,start,end,color)=>{for(let a=start;a<=end;a+=3)dot(cx+Math.cos(a*Math.PI/180)*r,cy+Math.sin(a*Math.PI/180)*r,color);};
    draw({dot,line,arc});
    return `<svg viewBox="0 0 32 28" width="100%" height="100%" aria-hidden="true" focusable="false">${[...points.values()].map(p=>`<circle cx="${p.x+.5}" cy="${p.y+.5}" r=".34" fill="${COLORS[p.color] || p.color}"/>`).join("")}</svg>`;
}
const iconCache=new Map();
function weatherIcon(kind,isDay=1) {
    const key=kind+":"+isDay;if(iconCache.has(key)) return iconCache.get(key);
    const svg=makeDotIcon(({dot,line,arc})=>{
        const sun=(cx,cy,r)=>{arc(cx,cy,r,0,360,"amber");for(let a=0;a<360;a+=45){const rad=a*Math.PI/180;line(cx+Math.cos(rad)*(r+2),cy+Math.sin(rad)*(r+2),cx+Math.cos(rad)*(r+4),cy+Math.sin(rad)*(r+4),"amber");}};
        const moon=(cx,cy)=>{arc(cx,cy,6,45,290,"cyan");arc(cx+3,cy-2,5,80,245,"cyan");};
        const cloud=()=>{arc(7,15,4,90,260,"white");arc(14,12,6,185,345,"white");arc(22,15,4,235,450,"white");line(7,19,22,19,"white");};
        if(kind==="clear"){isDay===0 ? moon(16,13) : sun(16,13,5);return;}
        if(kind==="unknown"){line(11,14,13,14,"gray");line(18,14,20,14,"gray");return;}
        if(kind==="partly"){isDay===0 ? moon(23,8) : sun(23,8,3);cloud();return;}
        if(kind==="drop"){line(16,3,9,16,"blue");arc(16,17,7,0,180,"blue");line(23,17,16,3,"blue");return;}
        cloud();
        if(["rain","storm","sleet"].includes(kind)){for(let x=9;x<=24;x+=5){line(x,22,x-1,24,"blue");dot(x-2,27,"blue");}}
        if(["snow","sleet"].includes(kind)){for(let x=8;x<26;x+=7){line(x-1,24,x+1,24,"cyan");line(x,23,x,25,"cyan");}}
        if(kind==="fog"){line(5,22,26,22,"gray");line(8,25,23,25,"gray");}
        if(kind==="storm"){line(18,17,14,22,"amber");line(14,22,18,22,"amber");line(18,22,14,27,"amber");}
    });iconCache.set(key,svg);return svg;
}
function instrumentIcon(kind,color="cyan") {
    return makeDotIcon(({dot,line,arc})=>{
        if(kind==="drop"){line(16,3,10,15,color);arc(16,17,6,0,180,color);line(22,17,16,3,color);line(13,17,14,20,color);}
        if(kind==="wind"){line(3,10,23,10,color);arc(23,7,3,265,450,color);line(6,15,26,15,color);line(3,20,17,20,color);arc(17,23,3,270,450,color);}
        if(kind==="sunrise" || kind==="sunset"){arc(16,20,6,180,360,"amber");line(3,21,29,21,"amber");for(let a=200;a<350;a+=35){let r=a*Math.PI/180;line(16+Math.cos(r)*9,20+Math.sin(r)*9,16+Math.cos(r)*11,20+Math.sin(r)*11,"amber");}const y=kind==="sunrise"?4:8;line(16,3,16,9,"amber");line(13,6,16,y,"amber");line(19,6,16,y,"amber");}
        if(kind==="alert"){line(16,3,3,25,color);line(3,25,29,25,color);line(29,25,16,3,color);line(16,11,16,17,color);dot(16,21,color);}
        if(kind==="signal"){for(let i=0;i<4;i++)for(let x=0;x<2;x++)line(5+i*6+x,24,5+i*6+x,20-i*5,color);}
    });
}

// 8. CACHE · Location-specific; storage denial never interrupts the display.
const CACHE_KEY="alephon.weather.v1:"+CONFIG.location.latitude+","+CONFIG.location.longitude;
function saveCache() {
    try { localStorage.setItem(CACHE_KEY,JSON.stringify({version:1,lastSuccessfulWeatherUpdate:state.lastSuccessfulWeatherUpdate,data:state.data})); }
    catch { state.cacheStatus="Storage unavailable; memory cache only"; }
}
function readCache() {
    try {
        const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
        if(!cached || cached.version!==1 || !number(cached.lastSuccessfulWeatherUpdate) || cached.lastSuccessfulWeatherUpdate<=0 || cached.lastSuccessfulWeatherUpdate>Date.now()+60000 || !number(cached.data?.current?.temperature) || !Array.isArray(cached.data.hourly) || !Array.isArray(cached.data.daily)) return;
        new Intl.DateTimeFormat("en-US",{timeZone:cached.data.timezone}).format(new Date());
        if(!cached.data.hourly.every(row=>row && number(row.time)) || !cached.data.daily.every(row=>row && typeof row==="object")) return;
        state.data=cached.data;state.lastSuccessfulWeatherUpdate=cached.lastSuccessfulWeatherUpdate;state.failed=true;
    } catch { state.cacheStatus="Cache unavailable or invalid"; }
}

// 9. STATUS · Edit generateWeatherStatus() to change footer priorities or wording.
// This is a forecast summary, not an official severe-weather alert feed.
// Pure selection function: no DOM, storage, additional requests, or random rotation.
function generateWeatherStatus(data, options = {}) {
    const now = options.now ?? Date.now()/1000;
    const settings = CONFIG.weatherStatus;
    const message = (text, icon="unknown", color="cyan", isDay=1) => ({text, icon, color, isDay});
    if(!data?.current) return message("FORECAST UNAVAILABLE", "unknown", "gray");
    const current=data.current;
    const age=(now*1000-(options.lastSuccessfulWeatherUpdate ?? state.lastSuccessfulWeatherUpdate))/60000;
    const observationAge=number(current.time) ? (now-current.time)/60 : Infinity;
    if(age>settings.staleAfterMinutes || observationAge>settings.staleAfterMinutes)
        return message("WEATHER DATA STALE", "alert", "amber");
    if(options.cached) return message("USING CACHED WEATHER", "unknown", "amber");

    const night=current.isDay===0;
    const info=conditionFor(current.code,current.isDay);
    const horizon=now+settings.lookAheadHours*3600;
    const upcoming=(data.hourly || []).filter(row=>number(row.time) && row.time>now && row.time<=horizon).sort((a,b)=>a.time-b.time);
    const time=epoch=>new Intl.DateTimeFormat("en-GB",{timeZone:data.timezone,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(epoch*1000));
    const solar=(data.daily || []).flatMap(day=>[
        {time:day.sunrise,name:"SUNRISE",icon:"sunrise"},
        {time:day.sunset,name:"SUNSET",icon:"sunset"}
    ]).filter(event=>number(event.time) && event.time>now).sort((a,b)=>a.time-b.time);
    const nextSolar=solar[0];
    const precipitationType=code=>[95,96,99].includes(code) ? "THUNDERSTORMS" : [56,57,66,67].includes(code) ? "FREEZING RAIN" : [71,73,75,77,85,86].includes(code) ? "SNOW" : [51,53,55,61,63,65,80,81,82].includes(code) ? "RAIN" : null;

    // 1. Notable current conditions. These are model conditions, never alert claims.
    if([95,96,99,56,57,65,66,67,75,82,86].includes(current.code))
        return message(info.label+" NOW",info.icon,"amber",current.isDay);
    if(number(current.wind) && current.wind>=settings.strongWindMph)
        return message("STRONG WIND · "+rounded(current.wind," MPH"),"wind","amber");
    if(number(current.feels) && (current.feels>=105 || current.feels<=20))
        return message((current.feels>=105 ? "HOT" : "COLD")+" · FEELS "+rounded(current.feels,"°"),"alert","amber");
    if(precipitationType(current.code)) return message(info.label+" NOW",info.icon,info.color,current.isDay);

    // 2. Imminent thunder first, then the earliest precipitation signal.
    const thunder=upcoming.find(row=>[95,96,99].includes(row.code));
    if(thunder) return message("THUNDERSTORMS POSSIBLE "+time(thunder.time),"storm","amber");
    const wet=upcoming.find(row=>precipitationType(row.code) || (number(row.precip) && row.precip>=settings.precipitationPossiblePercent));
    if(wet){
        const type=precipitationType(wet.code) || "RAIN";
        const expected=number(wet.precip) && wet.precip>=settings.precipitationExpectedPercent;
        const chance=number(wet.precip) ? " · "+rounded(wet.precip,"%") : "";
        const icon=type==="SNOW" ? "snow" : type==="FREEZING RAIN" ? "sleet" : "rain";
        return message(type+(expected ? " EXPECTED " : " POSSIBLE ")+time(wet.time)+chance,icon,"cyan");
    }
    if(!upcoming.length) return message("FORECAST UNAVAILABLE","unknown","gray");

    // 3. A meaningful temperature move or a sustained change in sky conditions.
    const trend=upcoming.find(row=>number(row.temperature) && number(current.temperature) && Math.abs(row.temperature-current.temperature)>=settings.significantTemperatureChangeF);
    if(trend){
        const cooling=trend.temperature<current.temperature;
        const timing=night && trend.isDay===0 ? " OVERNIGHT" : " BY "+time(trend.time);
        return message((cooling ? "COOLING" : "WARMING")+timing+" · "+rounded(current.temperature,"°")+" → "+rounded(trend.temperature,"°"),"clear",cooling ? "cyan" : "amber",current.isDay);
    }
    const skyChange=upcoming.find((row,i)=>{
        const next=upcoming[i+1];
        if(!next || next.time-row.time>3600) return false;
        return current.code<=1 && row.code===3 && next.code===3 || current.code===3 && row.code<=1 && next.code<=1;
    });
    if(skyChange) return message((skyChange.code===3 ? "CLOUDS INCREASING " : "CLEARING ")+time(skyChange.time),skyChange.code===3 ? "cloud" : "clear","cyan",skyChange.isDay);

    // 4. Nearby solar event; epoch subtraction remains correct across midnight/DST.
    if(nextSolar && (nextSolar.time-now)/60<=settings.solarCountdownMinutes){
        const minutes=Math.max(1,Math.ceil((nextSolar.time-now)/60));
        const duration=(minutes>=60 ? Math.floor(minutes/60)+"H " : "")+(minutes%60 ? minutes%60+"M" : "");
        return message(nextSolar.name+" "+time(nextSolar.time)+" · IN "+duration.trim(),nextSolar.icon,"amber");
    }

    // 5. Stable short-term summary. Never claim an entire night without coverage.
    if(number(current.wind) && current.wind>=settings.breezyMph) return message("BREEZY · WIND "+rounded(current.wind," MPH"),"wind","cyan");
    if(number(current.humidity) && current.humidity>=settings.humidPercent) return message((night ? "HUMID NIGHT" : "HUMID")+" · "+rounded(current.humidity,"% RH"),"drop","blue");
    const dryClear=row=>number(row.code) && row.code<=1 && number(row.precip) && row.precip<settings.precipitationPossiblePercent;
    const sunrise=solar.find(event=>event.name==="SUNRISE");
    const overnight=night && sunrise && sunrise.time<=horizon ? upcoming.filter(row=>row.time<sunrise.time) : [];
    const contiguous=rows=>rows.length>0 && rows[0].time-now<=3600 && rows.every((row,i)=>!i || row.time-rows[i-1].time<=3600);
    if(dryClear({...current,precip:0}) && contiguous(overnight) && sunrise.time-overnight[overnight.length-1].time<=3600 && overnight.every(dryClear))
        return message("CLEAR OVERNIGHT · SUNRISE "+time(sunrise.time),"clear","cyan",0);
    const stable=[];
    for(const row of upcoming){
        if(stable.length && row.time-stable[stable.length-1].time>3600) break;
        if(number(current.code) && (current.code<=1 ? dryClear(row) : row.code===current.code)) stable.push(row); else break;
    }
    if(contiguous(stable)) return message(info.label+" THROUGH "+time(stable[stable.length-1].time),info.icon,info.color,current.isDay);
    if(nextSolar) return message(nextSolar.name+" "+time(nextSolar.time),nextSolar.icon,"amber");
    return message(info.label+" · "+rounded(current.temperature,"°"),info.icon,info.color,current.isDay);
}
function renderContextStatus(live) {
    const status=generateWeatherStatus(state.data,{cached:!live});
    setText("context-text",status.text);
    $("context-status").title=status.text;
    $("context-icon").innerHTML=["wind","sunrise","sunset","alert"].includes(status.icon)
        ? instrumentIcon(status.icon,status.color) : weatherIcon(status.icon,status.isDay);
}

// ONLINE means a successful, recent API response, not merely Wi-Fi.
function updateStatus() {
    const age=Date.now()-state.lastSuccessfulWeatherUpdate;
    const live=state.data && !state.failed && navigator.onLine!==false && age<=refreshMs*2;
    const label=live ? "ONLINE" : state.data ? "CACHED" : state.busy ? "CONNECTING" : "OFFLINE";
    const color=live ? "green" : label==="CONNECTING" ? "cyan" : "amber";
    setText("connection-label",label);$("connection").style.color=COLORS[color];
    $("signal").innerHTML=instrumentIcon("signal",color);
    let updated="WX AWAITING DATA";
    if(state.lastSuccessfulWeatherUpdate){
        const date=new Date(state.lastSuccessfulWeatherUpdate);
        const timestamp=new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false}).format(date);
        updated=age>=86400000 ? "WX CACHED " + Math.floor(age/86400000)+"D AGO" : "WX UPDATED "+timestamp;
    }
    setText("updated",updated);renderContextStatus(live);updateDebug();
}
function updateDebug() {
    $("debug").hidden=!CONFIG.debug;
    if(CONFIG.debug) $("debug").textContent=`Viewport ${innerWidth} × ${innerHeight} · DPR ${devicePixelRatio}\nAPI: ${state.fetchStatus}\nLast success: ${state.lastSuccessfulWeatherUpdate ? new Date(state.lastSuccessfulWeatherUpdate).toISOString() : "Never"}\nCache: ${state.cacheStatus}`;
}
function shiftDisplay() {
    if(!CONFIG.appearance.burnInProtection || matchMedia("(prefers-reduced-motion: reduce)").matches) {$("console").style.transform="none";return;}
    const x=Math.floor(Math.random()*7)-3, y=Math.floor(Math.random()*7)-3;
    $("console").style.transform=`translate(${x}px,${y}px)`;
}

// 10. INITIALIZATION · Resume immediately after iPadOS suspends background JavaScript.
$("location").textContent=CONFIG.location.name;
$("clock-wrap").classList.toggle("seconds",CONFIG.clock.showSeconds);
document.documentElement.style.setProperty("--dot-spacing",Math.max(3,Math.min(6,Number(CONFIG.appearance.dotDensity)||4))+"px");
document.querySelectorAll("[data-icon]").forEach(element=>{element.innerHTML=instrumentIcon(element.dataset.icon,element.dataset.color||"cyan");});
readCache();updateClock();renderWeather();fetchWeather();updateStatus();
setInterval(updateClock,1000);
setInterval(()=>{if(!document.hidden && Date.now()-state.lastAttempt>=refreshMs)fetchWeather();},15000);
setInterval(shiftDisplay,12*60000);
window.addEventListener("offline",()=>{state.failed=true;updateStatus();});
window.addEventListener("online",()=>{if(Date.now()-state.lastAttempt>=60000)fetchWeather();});
function resume(){updateClock();if(Date.now()-state.lastAttempt>=refreshMs)fetchWeather();else updateStatus();}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resume();});
window.addEventListener("pageshow",resume);
window.addEventListener("resize",updateDebug);
</script>
